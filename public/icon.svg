<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="32" height="32" fill="#0B0F17" />
  
  <!-- Outer Radar Ring -->
  <circle cx="16" cy="16" r="13" stroke="#1E293B" stroke-width="1.2" />
  <circle cx="16" cy="16" r="10" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="16" cy="16" r="6.5" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />
  
  <!-- Crosshairs -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2" />
  <line x1="2" y1="16" x2="30" y2="16" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2" />
  
  <!-- Central Target Cross -->
  <line x1="16" y1="12" x2="16" y2="20" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="square" />
  <line x1="12" y1="16" x2="20" y2="16" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="square" />

  <!-- Active Radar Beam Sweep -->
  <path d="M16 16 L27 8" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="square" />
  
  <!-- Pulse Blip at Target -->
  <rect x="23" y="6" width="3" height="3" fill="#00F0FF" />
  
  <!-- Center Core -->
  <rect x="15" y="15" width="2" height="2" fill="#38BDF8" />
</svg>
